<style>
:root{--ink:#13233F;--muted:#3d4a63;--soft:#6b7896;--tl:#0FA3A3;--cor:#FF6B5E;--sun:#FFB020;--sky:#3A86FF;--vio:#8E6CEF;--green:#16a34a;--red:#d92d2d}
*{box-sizing:border-box}body{margin:0;font-family:Nunito,sans-serif;color:var(--ink);background:#F4FAFB radial-gradient(circle at 8% 10%,#D3F2EF 0,transparent 35%),radial-gradient(circle at 95% 5%,#FFF0C9 0,transparent 30%),radial-gradient(circle at 90% 95%,#FFE1DD 0,transparent 35%);min-height:100vh}
header{display:flex;align-items:center;gap:14px;padding:12px 22px;flex-wrap:wrap}
header h1{font:800 32px 'Baloo 2';margin:0}.pill{padding:6px 14px;border-radius:999px;font:900 13px Nunito;letter-spacing:1.5px;text-transform:uppercase;background:#d9f5f3;color:#0b6f6f}
.sp{flex:1}
.role{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:6px 8px 6px 14px;box-shadow:0 4px 0 #dbe9ec;font:800 16px Nunito}
.role b{font:800 22px 'Baloo 2';color:var(--cor);min-width:62px}
main{display:grid;grid-template-columns:300px 1fr 430px;gap:18px;padding:0 22px 22px}
@media(max-width:1200px){main{grid-template-columns:1fr}}
.card{background:#fff;border-radius:22px;padding:16px 18px;box-shadow:0 6px 0 #dbe9ec,0 20px 40px -24px rgba(15,70,90,.3)}
.tasks{display:grid;gap:10px;align-content:start}
.tk{display:flex;gap:12px;align-items:center;text-align:left;border:0;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 #dbe9ec;cursor:pointer;font:800 17px/1.25 Nunito;color:var(--ink);border:3px solid transparent}
.tk i{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-style:normal;color:#fff;font:800 22px 'Baloo 2'}
.tk small{display:block;font:700 13px Nunito;color:var(--soft)}.tk.on{border-color:var(--tl);background:#effaf9}.tk.ok i{background:var(--green)!important}
.kick{font:900 13px Nunito;letter-spacing:3px;text-transform:uppercase;color:var(--tl)}
h2{font:800 34px/1.05 'Baloo 2';margin:4px 0 8px}
.brief{font:700 17px/1.45 Nunito;color:var(--muted)}.brief b{color:var(--ink)}
.io{display:flex;gap:10px;margin:10px 0;flex-wrap:wrap}.io span{background:#f3f8fa;border-radius:12px;padding:6px 12px;font:800 14px Nunito}
.ed{position:relative;background:#0f1b2d;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px -14px rgba(10,30,60,.5)}
.ed .bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:#17263d;color:#8fa5c7;font:600 14px 'JetBrains Mono'}
.ed .bar i{width:12px;height:12px;border-radius:50%;display:inline-block}
.ed .body{display:flex;max-height:520px;overflow:auto}
.ed .nums{padding:14px 10px 14px 14px;color:#55688a;font:500 17px/1.6 'JetBrains Mono';text-align:right;user-select:none;white-space:pre}
.ed textarea{flex:1;border:0;outline:0;resize:none;background:transparent;color:#e6edf7;font:500 17px/1.6 'JetBrains Mono';padding:14px 14px 14px 6px;min-height:420px;tab-size:4;white-space:pre;overflow:hidden}
.btn{border:0;border-radius:16px;padding:0 20px;height:54px;font:800 19px Nunito;color:#fff;background:var(--tl);box-shadow:0 5px 0 #0a6f6f;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #0a6f6f}.btn.sky{background:var(--sky);box-shadow:0 5px 0 #1f5fd1}.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #dbe9ec;border:3px solid #e1edf0}.btn.sm{height:42px;font-size:15px;padding:0 14px}
.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.in{flex:1;min-width:120px;height:54px;border-radius:16px;border:4px solid #d8eaec;padding:0 14px;font:700 18px 'JetBrains Mono'}
.con{background:#0f1b2d;color:#e6edf7;border-radius:18px;padding:12px 16px;font:500 16px/1.55 'JetBrains Mono';min-height:170px;max-height:300px;overflow:auto;white-space:pre-wrap;margin-top:10px}
.con .err{color:#ff8c8c}.con .sys{color:#7fe3c8}
.test{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px solid #eef4f6;font:700 16px/1.3 Nunito}
.test i{flex:none;width:32px;height:32px;border-radius:10px;background:#e5edf1;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff}
.test.pass i{background:var(--green)}.test.fail i{background:var(--red)}
.test code{font:600 14px 'JetBrains Mono';background:#f3f8fa;padding:2px 6px;border-radius:6px}
.hint{display:none;margin-top:10px;background:#fff8e6;border-radius:14px;padding:10px 14px;font:700 16px/1.45 Nunito}
.ok-banner{display:none;margin-top:12px;background:linear-gradient(135deg,#e1f7f4,#fff3d6);border-radius:16px;padding:12px 16px;font:800 20px Nunito}
#ld{font:700 14px Nunito;color:var(--soft)}

   tests: [{ in: ['keys'], has: ['2'], no: ['not found'], d: 'keys → position 2' }, { in: ['bag'], has: ['0'], no: ['not found'], d: 'bag (first item) → position 0' }, { in: ['pen'], has: ['not found'], d: 'pen (missing) → Not found' }],
   hint: 'Use <b>for i in range(len(items)):</b>. Print “Not found” only <b>after</b> the loop, when <b>found</b> is still False.' },
 { n: 'Task 2', t: 'Student ID lookup', alg: 'Binary', c: '#3A86FF', file: 'id_lookup.py',
   brief: 'The IDs are <b>sorted from smallest to largest</b>. Use Binary Search: print the index and the number of steps, or <b>Not found</b>.',
   io: ['INPUT: a student ID', 'OUTPUT: index + steps, or “Not found”', 'Why Binary? Sorted list'],
   code: 'ids = [1003, 1011, 1024, 1036, 1042, 1057, 1063, 1078, 1085, 1099]\nkey = int(input("ID: "))\nfirst = 0\nlast = len(ids) - 1\nsteps = 0\nfound = False\n\nwhile first <= last:\n    mid = (first + last) // 2\n    steps = steps + 1\n    # TODO: if ids[mid] == key → print "Found at", mid, "in", steps, "steps", set found, break\n    # TODO: elif ids[mid] < key → first = ?\n    # TODO: else → last = ?\n    break  # delete this line when your loop is ready\n\nif not found:\n    print("Not found")\n',
   sol: 'ids = [1003, 1011, 1024, 1036, 1042, 1057, 1063, 1078, 1085, 1099]\nkey = int(input("ID: "))\nfirst = 0\nlast = len(ids) - 1\nsteps = 0\nfound = False\nwhile first <= last:\n    mid = (first + last) // 2\n    steps = steps + 1\n    if ids[mid] == key:\n        print("Found at", mid, "in", steps, "steps")\n        found = True\n        break\n    elif ids[mid] < key:\n        first = mid + 1\n    else:\n        last = mid - 1\nif not found:\n    print("Not found")\n',
   tests: [{ in: ['1063'], has: ['found at 6', '4 steps'], d: '1063 → found at 6 in 4 steps' }, { in: ['1003'], has: ['found at 0'], d: '1003 (first ID) → found at 0' }, { in: ['1099'], has: ['found at 9'], d: '1099 (last ID) → found at 9' }, { in: ['1050'], has: ['not found'], d: '1050 (missing) → Not found' }],
   hint: 'If the middle ID is too small, the key is on the right: <b>first = mid + 1</b>. If it is too big: <b>last = mid - 1</b>.' },
 { n: 'Debug A', t: 'The loop that never stops', alg: 'Debug', c: '#FF6B5E', file: 'binary_bug.py',
   brief: 'Run this binary search with <b>47</b>. It never finishes! The lab stops it after a few seconds. Find the bug and fix it.',
   io: ['Try: 47, 2, 50', 'Hint: does the range shrink?'],
   code: 'nums = [2, 3, 5, 8, 13, 21, 32, 47]\nkey = int(input("Key: "))\nfirst = 0\nlast = len(nums) - 1\nfound = False\nwhile first <= last:\n    mid = (first + last) // 2\n    if nums[mid] == key:\n        print("Found at", mid)\n        found = True\n        break\n    elif nums[mid] < key:\n        first = mid\n    else:\n        last = mid\nif not found:\n    print("Not found")\n',
   sol: 'nums = [2, 3, 5, 8, 13, 21, 32, 47]\nkey = int(input("Key: "))\nfirst = 0\nlast = len(nums) - 1\nfound = False\nwhile first <= last:\n    mid = (first + last) // 2\n    if nums[mid] == key:\n        print("Found at", mid)\n        found = True\n        break\n    elif nums[mid] < key:\n        first = mid + 1\n    else:\n        last = mid - 1\nif not found:\n    print("Not found")\n',
   tests: [{ in: ['47'], has: ['found at 7'], d: '47 → found at 7 (no endless loop)' }, { in: ['2'], has: ['found at 0'], d: '2 → found at 0' }, { in: ['50'], has: ['not found'], d: '50 (missing) → Not found' }],
   hint: '<b>first = mid</b> and <b>last = mid</b> can keep the same range forever. Move past mid: <b>mid + 1</b> and <b>mid - 1</b>.' },
 { n: 'Debug B', t: '“Not found” too early', alg: 'Debug', c: '#FFB020', file: 'linear_bug.py',
   brief: 'Search for <b>Sara</b>. The program says “Not found”, but Sara is in the list! Fix it with a <b>found</b> flag.',

   sol: 'names = ["Omar", "Lina", "Sara", "Ali", "Huda"]\nkey = input("Name: ")\nfound = False\nfor i in range(len(names)):\n    if names[i] == key:\n        print("Found at", i)\n        found = True\n        break\nif not found:\n    print("Not found")\n',
   tests: [{ in: ['Sara'], has: ['found at 2'], no: ['not found'], d: 'Sara → found at 2' }, { in: ['Omar'], has: ['found at 0'], no: ['not found'], d: 'Omar → found at 0' }, { in: ['Huda'], has: ['found at 4'], no: ['not found'], d: 'Huda (last) → found at 4' }, { in: ['Zaid'], has: ['not found'], no: ['found at'], d: 'Zaid (missing) → Not found' }],
   hint: 'The <b>else</b> runs after the first name that does not match. Remove it, and print “Not found” <b>after</b> the loop if found is False.' },
 { n: 'Challenge', t: 'Prove it: count the steps', alg: 'Justify', c: '#8E6CEF', file: 'race.py',
   brief: 'Count how many checks each search needs to find the <b>last</b> number in a sorted list of 1,000,000 numbers. Print both counts. Which would you choose, and why?',
   io: ['OUTPUT: Linear steps + Binary steps', 'No input needed'],
   code: 'nums = list(range(1000000))   # 0 .. 999999 (sorted)\nkey = 999999\n\n# Linear: count the checks\nlin = 0\nfor i in range(len(nums)):\n    lin = lin + 1\n    if nums[i] == key:\n        break\n\n# Binary: count the checks\nbin_steps = 0\nfirst, last = 0, len(nums) - 1\n# TODO: write the binary search loop and count bin_steps\n\nprint("Linear steps:", lin)\nprint("Binary steps:", bin_steps)\n',
   sol: 'nums = list(range(1000000))   # 0 .. 999999 (sorted)\nkey = 999999\nlin = 0\nfor i in range(len(nums)):\n    lin = lin + 1\n    if nums[i] == key:\n        break\nbin_steps = 0\nfirst, last = 0, len(nums) - 1\nwhile first <= last:\n    mid = (first + last) // 2\n    bin_steps = bin_steps + 1\n    if nums[mid] == key:\n        break\n    elif nums[mid] < key:\n        first = mid + 1\n    else:\n        last = mid - 1\nprint("Linear steps:", lin)\nprint("Binary steps:", bin_steps)\n',
   tests: [{ in: [], has: ['linear steps: 1000000', 'binary steps: 20'], d: 'Linear 1000000 · Binary 20' }],

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const SK = 'v12s4-lab-';
let cur = Math.max(0, Math.min(TASKS.length - 1, (+new URLSearchParams(location.search).get('task') || 1) - 1));
const done = new Set(JSON.parse(localStorage.getItem(SK + 'done') || '[]'));
// ---------------- python worker ----------------
const WSRC = `importScripts('https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js');
let py; const ready = loadPyodide().then(p => { py = p; postMessage({ ready: true }); });
onmessage = async (e) => { await ready; const { id, code, inputs } = e.data; let out = '';
  const w = (s, err) => { out += s + '\\n'; postMessage({ id, chunk: s, err }); };
  py.setStdout({ batched: s => w(s) }); py.setStderr({ batched: s => w(s, true) });
  py.globals.set('__inputs', py.toPy(inputs));
  try { await py.runPythonAsync("import builtins\\n_q=list(__inputs)\\ndef _inp(p=''):\\n    v=_q.pop(0) if _q else ''\\n    print(str(p)+str(v))\\n    return v\\nbuiltins.input=_inp");
    await py.runPythonAsync(code); postMessage({ id, done: true, out });
  } catch (err) { const m = String(err.message || err).split('\\n'); const ln = (m.join('\\n').match(/File "<exec>", line (\\d+)/g) || []).pop(); postMessage({ id, done: true, out, error: (ln ? ln.replace('File "<exec>", ', '') + ': ' : '') + m.filter(x => x.trim()).pop() }); } };`;
let W = null, wReady = false, rid = 0; const pend = {};
function spawn() { wReady = false; $('#ld').textContent = '⏳ Loading Python…'; $('#run').disabled = $('#chk').disabled = true;
  W = new Worker(URL.createObjectURL(new Blob([WSRC], { type: 'text/javascript' })));
  W.onmessage = e => { const d = e.data; if (d.ready) { wReady = true; $('#ld').textContent = '✅ Python ready'; $('#run').disabled = $('#chk').disabled = false; return; } const p = pend[d.id]; if (!p) return; if (d.chunk !== undefined) p.onChunk && p.onChunk(d.chunk, d.err); if (d.done) { clearTimeout(p.to); delete pend[d.id]; p.res(d); } };
  W.onerror = () => { $('#ld').textContent = '⚠️ Could not load Python. Check the internet connection.'; }; }
function runPy(code, inputs, onChunk, ms = 4000) { return new Promise(res => { const id = ++rid; const p = pend[id] = { res, onChunk }; p.to = setTimeout(() => { W.terminate(); delete pend[id]; spawn(); res({ timeout: true, out: '' }); }, ms); W.postMessage({ id, code, inputs }); }); }
spawn();
// ---------------- UI ----------------
function paintTasks() { $('#tasks').innerHTML = TASKS.map((T, i) => `<button class="tk${i === cur ? ' on' : ''}${done.has(i) ? ' ok' : ''}" data-i="${i}"><i style="background:${T.c}">${done.has(i) ? '✓' : i + 1}</i><span>${esc(T.t)}<small>${T.n} · ${T.alg}</small></span></button>`).join('') + `<div class="card" style="font:700 15px/1.45 Nunito;color:var(--muted)"><b style="color:var(--ink)">Pairs:</b> the <b>driver</b> types, the <b>navigator</b> reads the task, picks the algorithm and checks every line. Swap every 5 minutes.</div>`; document.querySelectorAll('.tk').forEach(b => b.onclick = () => { save(); cur = +b.dataset.i; load(); }); }
const ta = $('#code');
function nums() { $('#nums').textContent = ta.value.split('\n').map((_, i) => i + 1).join('\n'); ta.style.height = 'auto'; ta.style.height = Math.max(420, ta.scrollHeight) + 'px'; }
function save() { localStorage.setItem(SK + cur, ta.value); }
function load() { const T = TASKS[cur]; history.replaceState(null, '', '?task=' + (cur + 1)); $('#tk').textContent = `${T.n} · ${T.alg}`; $('#tk').style.color = T.c; $('#tt').textContent = T.t; $('#tb').innerHTML = T.brief; $('#tio').innerHTML = T.io.map(x => `<span>${esc(x)}</span>`).join(''); $('#fn').textContent = T.file;
  ta.value = localStorage.getItem(SK + cur) || T.code; nums(); $('#out').innerHTML = '<span class="sys">Press ▶ Run to see the output here.</span>';
  $('#tests').innerHTML = T.tests.map(x => `<div class="test"><i>?</i><span>${esc(x.d)}</span></div>`).join(''); $('#okb').style.display = done.has(cur) ? 'block' : 'none'; $('#hint').style.display = 'none'; $('#inp').value = (T.tests[0].in[0] || ''); $('#inp').style.display = T.tests[0].in.length ? '' : 'none'; paintTasks(); }
ta.addEventListener('input', () => { nums(); save(); });
ta.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText('    ', s, ta.selectionEnd, 'end'); nums(); }
  if (e.key === 'Enter') { const s = ta.selectionStart, line = ta.value.slice(0, s).split('\n').pop(); let ind = line.match(/^\s*/)[0]; if (/:\s*$/.test(line)) ind += '    '; e.preventDefault(); ta.setRangeText('\n' + ind, s, ta.selectionEnd, 'end'); nums(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); $('#run').click(); } });
$('#rst').onclick = () => { if (confirm('Reset this task to the starter code?')) { ta.value = TASKS[cur].code; nums(); save(); } };
$('#run').onclick = async () => { const o = $('#out'); o.innerHTML = ''; const T = TASKS[cur]; const inputs = T.tests[0].in.length ? [$('#inp').value] : [];
  $('#run').disabled = true; const r = await runPy(ta.value, inputs, (c, err) => { o.insertAdjacentHTML('beforeend', `<div class="${err ? 'err' : ''}">${esc(c)}</div>`); o.scrollTop = 1e9; });
  if (r.timeout) o.insertAdjacentHTML('beforeend', '<div class="err">⏱ Stopped after 4 seconds: your loop never ended (endless loop?). Check how first / last change.</div>');
  else if (r.error) o.insertAdjacentHTML('beforeend', `<div class="err">⚠️ ${esc(r.error)}</div>`);
  else if (!r.out.trim()) o.insertAdjacentHTML('beforeend', '<div class="sys">(no output: did you print anything?)</div>');
  $('#run').disabled = !wReady; };
$('#chk').onclick = async () => { const T = TASKS[cur]; const rows = document.querySelectorAll('#tests .test'); let all = true; $('#chk').disabled = true;
  for (let i = 0; i < T.tests.length; i++) { const x = T.tests[i], row = rows[i]; row.className = 'test'; $('i', row); row.querySelector('i').textContent = '…';
    const r = await runPy(ta.value, x.in, null); const out = (r.out || '').toLowerCase().replace(/\s+/g, ' ');
    let ok = !r.timeout && !r.error && x.has.every(h => out.includes(h)) && !(x.no || []).some(h => out.includes(h));
    if (x.no && x.no.includes('not found') && out.includes('not found')) ok = false;
    row.className = 'test ' + (ok ? 'pass' : 'fail'); row.querySelector('i').textContent = ok ? '✓' : '✗';
    row.querySelector('span').innerHTML = esc(x.d) + (ok ? '' : `<br><code>${esc(r.timeout ? 'endless loop (stopped)' : r.error ? r.error : (r.out || '(no output)').trim().split('\n').slice(-2).join(' / '))}</code>`);
    all = all && ok; }
  $('#chk').disabled = !wReady; $('#okb').style.display = all ? 'block' : 'none';
  if (all) { done.add(cur); localStorage.setItem(SK + 'done', JSON.stringify([...done])); $('#okb').style.display = 'block'; paintTasks(); } };
$('#hb').onclick = () => { const h = $('#hint'); h.innerHTML = TASKS[cur].hint; h.style.display = 'block'; };
$('#sb').onclick = () => { if (!confirm('Try first! Show the model solution in the editor?')) return; ta.value = TASKS[cur].sol; nums(); save(); };
// swap timer
let swT = 300, swI = null; const swd = () => $('#sw').textContent = `${Math.floor(swT / 60)}:${String(swT % 60).padStart(2, '0')}`;
$('#swb').onclick = () => { if (swI) { clearInterval(swI); swI = null; $('#swb').textContent = 'Start'; return; } $('#swb').textContent = 'Pause'; swI = setInterval(() => { swT--; swd(); if (swT <= 0) { swT = 300; swd(); alertSwap(); } }, 1000); };
function alertSwap() { const b = $('.role'); b.style.background = '#FF6B5E'; b.style.color = '#fff'; $('#sw').textContent = 'SWAP!'; try { const a = new AudioContext(); [523, 659, 784].forEach((f, i) => { const o = a.createOscillator(), g = a.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.2, a.currentTime + i * .15); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + i * .15 + .3); o.connect(g).connect(a.destination); o.start(a.currentTime + i * .15); o.stop(a.currentTime + i * .15 + .35); }); } catch (e) { } setTimeout(() => { b.style.background = ''; b.style.color = ''; swd(); }, 3000); }
load();
</script></body></html>
