<style>
:root{--ink:#13233F;--muted:#3d4a63;--soft:#6b7896;--tl:#0FA3A3;--cor:#FF6B5E;--sun:#FFB020;--sky:#3A86FF;--vio:#8E6CEF;--green:#16a34a;--red:#d92d2d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:#F4FAFB radial-gradient(circle at 8% 10%,#D3F2EF 0,transparent 35%),radial-gradient(circle at 95% 5%,#FFF0C9 0,transparent 30%),radial-gradient(circle at 90% 95%,#FFE1DD 0,transparent 35%)}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top b{font:800 22px 'Baloo 2'}.top .sp{flex:1}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font:900 13px Nunito;letter-spacing:1.5px;text-transform:uppercase;background:#d9f5f3;color:#0b6f6f}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 0 #dbe9ec,0 20px 40px -24px rgba(15,70,90,.3);margin-bottom:14px}
h1{font:800 48px/1 'Baloo 2';margin:8px 0}
.c1{color:#0FA3A3}.c2{color:#FF6B5E}.c3{color:#FFB020}.c4{color:#3A86FF}.c5{color:#8E6CEF}
.btn{border:0;border-radius:18px;padding:0 22px;height:60px;font:800 22px Nunito;color:#fff;background:var(--tl);box-shadow:0 6px 0 #0a6f6f;cursor:pointer;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #0a6f6f}
.btn.pink{background:var(--cor);box-shadow:0 6px 0 #c9473c}.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 #dbe9ec;border:3px solid #e1edf0}
input.t{width:100%;height:60px;border-radius:18px;border:4px solid #d8eaec;padding:0 16px;font:800 22px Nunito;margin:10px 0}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hud .q{background:var(--ink);color:#fff}.hud .sc{margin-left:auto;font:800 30px 'Baloo 2';color:var(--sky)}
.timer{height:10px;border-radius:9px;background:#e3eef1;overflow:hidden;margin-bottom:12px}.timer i{display:block;height:100%;background:linear-gradient(90deg,#0FA3A3,#3A86FF);transition:width .2s linear}
.qq{font:800 24px/1.3 Nunito;margin:4px 0 14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:0;background:#fff;border-radius:18px;padding:14px;margin-bottom:10px;font:800 19px/1.3 Nunito;color:var(--ink);box-shadow:0 5px 0 #dbe9ec;cursor:pointer;border:3px solid #e9f2f4}
.opt i{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-style:normal;color:#fff;background:var(--sky);font-weight:900}
.opt.right{border-color:#16a34a;background:#e9f9ee}.opt.wrong{border-color:#d92d2d;background:#fdecec}.opt.fade{opacity:.45}
.code{background:#0f1b2d;border-radius:16px;padding:10px 0;font:500 15px/1.6 'JetBrains Mono';color:#e6edf7;overflow-x:auto;margin-bottom:10px}
.code .ln{padding:2px 12px;white-space:pre;cursor:pointer;border-left:6px solid transparent}.code .ln b{color:#55688a;display:inline-block;width:22px;font-weight:500}
.code .ln.good{background:rgba(32,201,151,.28);border-left-color:#20c997}.code .ln.bad{background:rgba(255,77,90,.28);border-left-color:#ff4d5a}
.tiles{display:flex;flex-wrap:wrap;gap:8px}.tile{border:0;border-radius:14px;padding:12px 14px;background:#eef6ff;font:700 15px 'JetBrains Mono';color:var(--ink);box-shadow:0 4px 0 #d4e2f5;cursor:pointer;text-align:left}
.tile.used{opacity:.3;pointer-events:none}.slot{min-height:80px;border:3px dashed #cfe2e6;border-radius:16px;padding:10px;margin-bottom:10px;font:700 15px/1.7 'JetBrains Mono'}
.row{display:flex;gap:10px}
.cubes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px}
.cb{width:58px;text-align:center}.cb div{height:58px;border-radius:14px;display:grid;place-items:center;font:800 22px 'Baloo 2';color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer;transition:.25s}
.cb small{font:700 12px 'JetBrains Mono';color:var(--soft)}.cb.dim div{opacity:.25;filter:grayscale(1)}.cb.cur div{outline:5px solid #ffb020;transform:translateY(-6px)}.cb.hit div{outline:5px solid #16a34a;transform:translateY(-8px) scale(1.06)}.cb.no div{outline:5px solid #d92d2d}
.vb{display:flex;gap:8px;justify-content:center;margin:6px 0}.vb span{background:#fff;border-radius:12px;padding:6px 12px;font:800 15px Nunito;box-shadow:0 3px 0 #dbe9ec}
.msg{font:800 17px/1.35 Nunito;text-align:center;min-height:46px}
.fb{border-radius:18px;padding:14px;margin-top:12px;font:700 17px/1.4 Nunito}.fb.good{background:#e9f9ee;border:3px solid #16a34a}.fb.bad{background:#fdecec;border:3px solid #d92d2d}.fb h3{margin:0 0 4px;font:800 26px 'Baloo 2'}
.letters{display:flex;flex-wrap:wrap;gap:3px;margin:8px 0}.letters i{width:21px;height:30px;border-radius:8px;background:#e7eef1;display:grid;place-items:center;font:800 18px 'Baloo 2';color:#fff;font-style:normal}.letters i.on{background:var(--tl)}.letters .sp{width:7px;background:none}
.big{font:800 90px/1 'Baloo 2';color:var(--sky);text-align:center}
.center{text-align:center}.muted{color:var(--muted);font-weight:700}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style></head><body><div class="wrap" id="app"></div>

  ${G.mystery ? `<p style="font:800 26px 'Baloo 2';color:#0FA3A3">Today: ${esc(G.topic)}</p>` : ''}<p class="muted">Look at the teacher’s screen for the leaderboard!</p><button class="btn ghost" id="again">Play again</button></div>`;
  $('#again').onclick = () => location.reload();
}
start();
</script></body></html>
